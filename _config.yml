# -------------------- 主题配置 --------------------
# 移除 theme: jekyll-theme-cayman
remote_theme: mmistakes/minimal-mistakes # 使用 remote_theme 代替 theme

# -------------------- 网站基本信息 --------------------
title: ZenBlog
author: Zen
email: zhangfeivariflight@gmail.com
url: "https://shaoless.github.io"
github_username: shaoless
twitter_username: Jsamchow
linkedin_username: wenjun-zhang-66261b8b
# -------------------- Minimal Mistakes 特有配置 --------------------
# Minimal Mistakes 需要定义一个 skin (皮肤)
minimal_mistakes_skin: "dirt" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
# 启用 Table of Contents
toc: true
toc_label: "文章目录"
toc_icon: "bars"
toc_sticky: true # 让目录在滚动时保持固定

# -------------------- 插件配置 --------------------
plugins:
  - jekyll-feed
  - jekyll-archives
  - jekyll-search
  - jekyll-sitemap
  - jemoji
  - jekyll-include-cache # Minimal Mistakes 推荐的插件
paginate: 10
paginate_path: "/blog/page:num/"
# -------------------- 档案配置 (保持不变) --------------------
jekyll-archives:
  enabled: ['categories','tags']
  layout: 'archive'
  permalinks:
    category: '/categories/:name/'
    tag: '/tags/:name/'

# -------------------- 导航栏链接 (Chirpy 专用) --------------------
# Chirpy 的导航链接通常配置在 _data/tabs.yml 文件中，但你可以在这里先定义

# -------------------- 博客文章设置 --------------------
show_excerpts: true

copyright: ""